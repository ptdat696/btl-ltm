<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multi-room Chat</title>
<style>
  :root {
    --bg: #f4f6f8; --panel: #fff; --text: #1d2733; --muted: #6b7785; --line: #e1e6eb;
    --accent: #0f766e; --accent-soft: #d9f0ed; --me: #0f766e; --me-text: #fff; --other: #eef1f4;
    --danger: #b42318; --pm: #7c3aed;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12171c; --panel: #1b2229; --text: #e6ebf0; --muted: #8b97a4; --line: #2c3640;
      --accent: #2dd4bf; --accent-soft: #173a38; --me: #0f766e; --me-text: #fff; --other: #26303a;
      --danger: #f97066; --pm: #a78bfa;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }

  #login { height: 100%; display: flex; align-items: center; justify-content: center; padding: 16px; }
  #login form { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 28px; width: 100%; max-width: 360px; }
  #login h1 { margin: 0 0 4px; font-size: 22px; }
  #login p { margin: 0 0 18px; color: var(--muted); }
  #login input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; font: inherit; background: var(--bg); color: var(--text); }
  #login button { margin-top: 12px; width: 100%; }
  #loginErr { color: var(--danger); min-height: 20px; margin-top: 10px; font-size: 14px; }

  button { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 10px 16px; font: inherit; font-weight: 600; cursor: pointer; }
  @media (prefers-color-scheme: dark) { button { color: #04201d; } }
  button:hover { filter: brightness(1.08); }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); }

  #app { display: none; height: 100%; grid-template-columns: 250px 1fr; grid-template-rows: 100%; }
  aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  aside section { padding: 14px; overflow-y: auto; }
  aside section:first-of-type { border-bottom: 1px solid var(--line); flex: 1 1 50%; }
  aside section:last-of-type { flex: 1 1 50%; }
  aside h2 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
  aside h2 button { padding: 3px 9px; font-size: 12px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 7px 10px; border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
  li:hover { background: var(--bg); }
  li.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  li .count { color: var(--muted); font-size: 13px; font-weight: 400; }
  li.self { cursor: default; color: var(--muted); }

  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  header { padding: 12px 18px; background: var(--panel); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  header strong { font-size: 16px; }
  header span { color: var(--muted); font-size: 14px; }
  #log { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: min(560px, 82%); padding: 8px 12px; border-radius: 12px; background: var(--other); word-wrap: break-word; white-space: pre-wrap; }
  .msg .who { display: block; font-size: 12px; font-weight: 700; color: var(--accent); margin-bottom: 1px; }
  .msg .time { font-size: 11px; color: var(--muted); margin-left: 8px; font-weight: 400; }
  .msg.me { align-self: flex-end; background: var(--me); color: var(--me-text); }
  .msg.me .who, .msg.me .time { color: rgba(255,255,255,.8); }
  .msg.pm { border: 1px dashed var(--pm); }
  .msg.pm .who { color: var(--pm); }
  .msg.pm.me .who { color: #e9ddff; }
  .sys { align-self: center; color: var(--muted); font-size: 13px; font-style: italic; text-align: center; }
  .err { align-self: center; color: var(--danger); font-size: 13px; }

  footer { padding: 12px 18px; background: var(--panel); border-top: 1px solid var(--line); }
  footer form { display: flex; gap: 8px; }
  footer input { flex: 1; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; font: inherit; background: var(--bg); color: var(--text); min-width: 0; }
  .hint { margin-top: 6px; font-size: 12px; color: var(--muted); }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  @media (max-width: 700px) {
    #app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    aside { flex-direction: row; border-right: 0; border-bottom: 1px solid var(--line); max-height: 150px; }
    aside section:first-of-type { border-bottom: 0; border-right: 1px solid var(--line); }
  }
</style>
</head>
<body>

<div id="login">
  <form id="loginForm">
    <h1>Multi-room Chat</h1>
    <p>Nhập nickname để vào phòng chat.</p>
    <input id="nick" maxlength="20" placeholder="Nickname (2-20 ký tự)" autocomplete="off" autofocus>
    <button type="submit">Vào chat</button>
    <div id="loginErr"></div>
  </form>
</div>

<div id="app">
  <aside>
    <section>
      <h2>Phòng <button class="ghost" id="newRoom" type="button">+ Phòng</button></h2>
      <ul id="rooms"></ul>
    </section>
    <section>
      <h2>Trong phòng</h2>
      <ul id="users"></ul>
    </section>
  </aside>
  <main>
    <header>
      <div><strong id="roomTitle">lobby</strong></div>
      <span id="me"></span>
    </header>
    <div id="log"></div>
    <footer>
      <form id="sendForm">
        <input id="msg" placeholder="Nhập tin nhắn... (hoặc /help)" autocomplete="off">
        <button type="submit">Gửi</button>
      </form>
      <div class="hint">Nhấp tên người dùng để nhắn riêng · Nhấp phòng để chuyển phòng</div>
    </footer>
  </main>
</div>

<script>
const $ = id => document.getElementById(id);
let ws = null, nick = '', room = '', loggedIn = false;

const HELP = "Lệnh: /join <phòng> · /leave · /rooms · /users · /pm <tên> <nd> · /quit";

function send(line) { if (ws && ws.readyState === 1) ws.send(line); }

function toWire(input) {
  if (!input.startsWith('/')) return 'MSG ' + input;
  const p = input.slice(1).split(/\s+/);
  switch ((p[0] || '').toLowerCase()) {
    case 'join':  return p[1] ? 'JOIN ' + p[1] : null;
    case 'leave': return 'LEAVE';
    case 'rooms': return 'ROOMS';
    case 'users': return 'USERS';
    case 'pm':    return p.length >= 3 ? 'PM ' + p[1] + ' ' + input.slice(input.indexOf(p[1], 3) + p[1].length).trim() : null;
    case 'quit':  return 'QUIT';
    default:      return null;
  }
}

function hhmm() { return new Date().toTimeString().slice(0, 5); }

function addLine(cls, text) {
  const d = document.createElement('div');
  d.className = cls; d.textContent = text;
  push(d);
}

function addMsg(who, text, mine, isPm) {
  const d = document.createElement('div');
  d.className = 'msg' + (mine ? ' me' : '') + (isPm ? ' pm' : '');
  const w = document.createElement('span'); w.className = 'who'; w.textContent = who;
  const t = document.createElement('span'); t.className = 'time'; t.textContent = hhmm();
  w.appendChild(t);
  d.appendChild(w);
  d.appendChild(document.createTextNode(text));
  push(d);
}

function push(el) {
  const log = $('log');
  const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 80;
  log.appendChild(el);
  if (atBottom || el.classList.contains('me')) log.scrollTop = log.scrollHeight;
}

function connect(name) {
  nick = name;
  $('loginErr').textContent = '';
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  ws.onopen = () => send('NICK ' + nick);
  ws.onmessage = e => handle(e.data);
  ws.onclose = () => {
    if (loggedIn) { addLine('err', 'Mất kết nối tới server. Tải lại trang để vào lại.'); $('msg').disabled = true; }
    else $('loginErr').textContent = $('loginErr').textContent || 'Không kết nối được tới server.';
  };
}

function handle(line) {
  const f = line.split('\t');
  switch (f[0]) {
    case 'NICKOK':
      nick = f[1]; loggedIn = true;
      $('login').style.display = 'none';
      $('app').style.display = 'grid';
      $('me').textContent = 'Bạn: ' + nick;
      send('WATCH');
      $('msg').focus();
      break;
    case 'ERROR':
      if (!loggedIn) { $('loginErr').textContent = f[1]; ws.close(); } else addLine('err', f[1]);
      break;
    case 'INFO':   if (loggedIn) addLine('sys', f[1]); break;
    case 'JOINED':
      room = f[1]; $('roomTitle').textContent = room; $('log').innerHTML = '';
      addLine('sys', "Bạn đã vào phòng '" + room + "'");
      markActive();
      break;
    case 'SYSTEM': addLine('sys', f[2]); break;
    case 'CHAT':   addMsg(f[2], f[3], f[2].toLowerCase() === nick.toLowerCase(), false); break;
    case 'PM': {
      const mine = f[1].toLowerCase() === nick.toLowerCase();
      addMsg(mine ? 'Riêng → ' + f[2] : 'Riêng từ ' + f[1], f[3], mine, true);
      break;
    }
    case 'ROOMS': renderRooms(f[1] || ''); break;
    case 'USERS': renderUsers(f[2] || ''); break;
  }
}

function renderRooms(s) {
  const ul = $('rooms'); ul.innerHTML = '';
  s.split(',').filter(Boolean).forEach(r => {
    const i = r.lastIndexOf(':'), name = r.slice(0, i), n = r.slice(i + 1);
    const li = document.createElement('li');
    li.dataset.room = name;
    const a = document.createElement('span'); a.textContent = '# ' + name;
    const c = document.createElement('span'); c.className = 'count'; c.textContent = n;
    li.append(a, c);
    li.onclick = () => send('JOIN ' + name);
    ul.appendChild(li);
  });
  markActive();
}

function markActive() {
  document.querySelectorAll('#rooms li').forEach(li => li.classList.toggle('active', li.dataset.room === room));
}

function renderUsers(s) {
  const ul = $('users'); ul.innerHTML = '';
  s.split(',').filter(Boolean).forEach(u => {
    const li = document.createElement('li');
    const self = u.toLowerCase() === nick.toLowerCase();
    li.textContent = self ? u + ' (bạn)' : u;
    if (self) li.className = 'self';
    else li.onclick = () => { $('msg').value = '/pm ' + u + ' '; $('msg').focus(); };
    ul.appendChild(li);
  });
}

$('loginForm').onsubmit = e => {
  e.preventDefault();
  const n = $('nick').value.trim();
  if (n) connect(n);
};

$('sendForm').onsubmit = e => {
  e.preventDefault();
  const text = $('msg').value.trim();
  $('msg').value = '';
  if (!text) return;
  if (text.toLowerCase() === '/help') { addLine('sys', HELP); return; }
  const wire = toWire(text);
  if (!wire) { addLine('err', HELP); return; }
  send(wire);
  if (wire === 'QUIT') setTimeout(() => location.reload(), 300);
};

$('newRoom').onclick = () => {
  const r = prompt('Tên phòng (chữ, số, _ hoặc -):');
  if (r && r.trim()) send('JOIN ' + r.trim());
};
</script>
</body>
</html>
