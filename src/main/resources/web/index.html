<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multi-room Chat</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="login">
  <form id="loginForm">
    <h1>Multi-room Chat</h1>
    <p>Nhập nickname để vào phòng chat.</p>
    <input id="nick" maxlength="20" placeholder="Nickname (2-20 ký tự)" autocomplete="off" autofocus>
    <button type="submit">Vào chat</button>
    <div id="loginErr"></div>
  </form>
</div>

<div id="app">
  <aside>
    <section>
      <h2>Phòng <button class="ghost" id="newRoom" type="button">+ Phòng</button></h2>
      <ul id="rooms"></ul>
    </section>
    <section>
      <h2>Trong phòng</h2>
      <ul id="users"></ul>
    </section>
  </aside>
  <main>
    <header>
      <div><strong id="roomTitle">lobby</strong></div>
      <span id="me"></span>
    </header>
    <div id="log"></div>
    <footer>
      <form id="sendForm">
        <input id="msg" placeholder="Nhập tin nhắn... (hoặc /help)" autocomplete="off">
        <button type="submit">Gửi</button>
      </form>
      <div class="hint">Nhấp tên người dùng để nhắn riêng · Nhấp phòng để chuyển phòng</div>
    </footer>
  </main>
</div>

<script src="app.js"></script>
</body>
</html>
